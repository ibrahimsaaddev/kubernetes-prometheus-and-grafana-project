apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "node"
        static_configs:
          - targets: ["node-exporter-service:9100"]

      - job_name: "kube-state-metrics"
        static_configs:
          - targets: ["kube-state-metrics-service:8080"]

      - job_name: "cadvisor"
        scheme: https
        metrics_path: /api/v1/nodes/minikube/proxy/metrics/cadvisor
        static_configs:
          - targets: ["kubernetes.default.svc:443"]
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
